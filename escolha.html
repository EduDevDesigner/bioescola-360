<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

  
<style>

/* ===== CONFIGURAÇÃO PADRÃO (MOBILE) ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: #001c40ff;
  color: #fff;
}

/* MOBILE ocupa 100% */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== DESKTOP CENTRALIZADO ===== */ 
@media (min-width: 868px) { 
  body { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #001c40ff; 
  } 

  .app-wrapper { 
    width: 490px; 
    height: 844px; 
    box-shadow: 0 0 40px rgba(0,0,0,0.6); 
  } 
}

/* ===== SEU CÓDIGO ORIGINAL ===== */

.background-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001c4000;
  z-index: 0;
}
  
.background-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
  
.background-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

/* =====================================================
MOLDURA DOS BOTÕES
===================================================== */

.buttons-frame{

position:absolute;
top:65%;
left:50%;
transform:translate(-50%, -50%);
width:120px;
height: 120px;
padding:25px 20px 35px 20px;
border-radius:22px;
z-index:3;
display:flex;
justify-content:center;
align-items:center;
overflow:visible;

}

/* =====================================================
CONTAINER DOS BOTÕES
===================================================== */

.buttons-container {

position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:35px;
width:100%;
}


/* =====================================================
BOTÕES
===================================================== */

#btnAR { 
    
  width: 340px;
  height: 200px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnAR:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnAR img{

width:200px;
height:250px;
object-fit:contain;

}
   
#btnPlay { 
    
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnPlay:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnPlay img{

width:200px;
height:80px;
object-fit:contain;

}

#btnSobre {
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnSobre:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnSobre img{

width:200px;
height:80px;
object-fit:contain;
}  

#btnCredito {
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnCredito:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnCredito img{

width:200px;
height:80px;
object-fit:contain;
}    

</style>
</head>

<body>

<!-- ÁUDIO DOS BOTÕES -->
<audio id="menuClickSound" src="Audios/acerto.mp3" preload="auto"></audio>
  
<div class="app-wrapper">

  <div class="background-container" aria-hidden="true">
    <img src="Imagens/Fundo2.jpg" alt="Play">
  </div>

  <audio id="bg-audio" autoplay loop muted>
  </audio>

  
<!-- =====================================================
MOLDURA
===================================================== -->

<div class="buttons-frame">

  <div class="buttons-container">

<!-- BOTÃO 1 -->
<button id="btnAR" class="ar-btn" onclick="location.href='experienciaAR.html'">

  <img src="Imagens/btnAR.png" alt="ar">

</button>    
    
  <!-- BOTÃO 2 -->
<button id="btnPlay" class="continue-btn" onclick="location.href='construcao.html'">

  <img src="Imagens/btnNossaHorta.png" alt="Play">

</button>
    
  <!-- BOTÃO 3 -->
<button id="btnSobre" class="sobre-btn" onclick="location.href='construcao.html'">

  <img src="Imagens/btnAgorEcologia.png" alt="Sobre">

</button>
    
  <!-- BOTÃO 4 -->
<button id="btnCredito" class="credito-btn" onclick="location.href='construcao.html'">

  <img src="Imagens/btnAprenda.png" alt="Credito">

</button>     

</div>

</div>

</div>

<script>

/* =====================================================
ÁUDIO DOS BOTÕES
===================================================== */

const menuClickSound = document.getElementById("menuClickSound");

function tocarSomBotao(){

  menuClickSound.pause();

  menuClickSound.currentTime = 0;

  menuClickSound.play().catch(() => {});

}

/* =====================================================
TODOS OS BOTÕES TOCAM O ÁUDIO AO CLICAR
===================================================== */

document.querySelectorAll("button").forEach(btn => {

  btn.addEventListener("click", tocarSomBotao);

});

</script>

</body>
</html>
