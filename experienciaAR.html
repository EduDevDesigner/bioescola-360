<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="BioEscola 360° - Horta Escolar em Realidade Aumentada"
    >

    <title>BIOESCOLA 360°</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


    <!-- =====================================================
         MINDAR
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- =====================================================
         CSS EXTERNO
         
         TODO O CSS DO PROJETO FICA NO style.css
    ====================================================== -->

    <link rel="stylesheet" href="./style.css">


</head>


<body>


    <!-- =====================================================
         MENSAGEM INICIAL
    ====================================================== -->

    <div id="track-message">

        Aponte a câmera para uma das placas
        da horta para iniciar a experiência.

    </div>
    

    <!-- =====================================================
         CONTADOR
    ====================================================== -->

    <div id="progressBox">

        🌱

        <span id="progressCount">0</span>

        / 6 categorias

    </div>


    <!-- =====================================================
         BOTÃO MENU
    ====================================================== -->

    <button
        id="menuToggleButton"
        type="button"
        aria-label="Abrir menu"
    >
        ☰
    </button>


    <!-- =====================================================
         BOTÃO QUIZ
    ====================================================== -->

    <button
        id="finalButtonTop"
        type="button"
        aria-label="Fazer quiz"
    >
        📝
    </button>
    

    <!-- =====================================================
         SOM DOS BOTÕES
         
         O JavaScript também funciona caso esse arquivo
         ainda não exista.
    ====================================================== -->

    <audio
        id="clickSound"
        preload="none"
    >

        <source
            src="./Audio/acerto.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO FOLHOSAS
    ====================================================== -->

    <audio
        id="audioFolhosas"
        preload="none"
    >

        <source
            src="./Audio/Folhosas.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO TEMPEROS
    ====================================================== -->

    <audio
        id="audioTemperos"
        preload="none"
    >

        <source
            src="./Audio/Temperos.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO FRUTOS
    ====================================================== -->

    <audio
        id="audioFrutos"
        preload="none"
    >

        <source
            src="./Audio/Frutos.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO FRUTAS
    ====================================================== -->

    <audio
        id="audioFrutas"
        preload="none"
    >

        <source
            src="./Audio/Frutas.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO MEDICINAIS
    ====================================================== -->

    <audio
        id="audioMedicinais"
        preload="none"
    >

        <source
            src="./Audio/Medicinais.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         ÁUDIO PANC
    ====================================================== -->

    <audio
        id="audioPanc"
        preload="none"
    >

        <source
            src="./Audio/PANC.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =====================================================
         PAINEL DE INTERAÇÃO
    ====================================================== -->

    <div id="interactionPanel">


        <!-- =================================================
             FOLHOSAS
        ================================================== -->

        <button
            id="folhosaAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="folhosaAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🌱 ESPÉCIES
        </button>


        <div
            id="folhosaSpeciesMenu"
            class="species-dropdown"
        >

            <button
                class="species-btn"
                type="button"
                data-species="alface"
            >
                🥬 Alface
            </button>

            <button
                class="species-btn"
                type="button"
                data-species="couve"
            >
                🥬 Couve-Manteiga
            </button>

            <button
                class="species-btn"
                type="button"
                data-species="rucula"
            >
                🌿 Rúcula
            </button>

        </div>


        <!-- =================================================
             TEMPEROS
        ================================================== -->

        <button
            id="temperoAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="temperoAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🌿 ESPÉCIES
        </button>


        <div
            id="temperoSpeciesMenu"
            class="species-dropdown"
        >

            <button
                class="species-btn"
                type="button"
                data-species="coentro"
            >
                🌿 Coentro
            </button>

        </div>


        <!-- =================================================
             FRUTOS
        ================================================== -->

        <button
            id="frutoAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="frutoAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🍅 ESPÉCIES
        </button>


        <div
            id="frutoSpeciesMenu"
            class="species-dropdown"
        >

            <button
                class="species-btn"
                type="button"
                data-species="tomate"
            >
                🍅 Tomate
            </button>

        </div>


        <!-- =================================================
             FRUTAS
        ================================================== -->

        <button
            id="frutaAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="frutaAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🍍 ESPÉCIES
        </button>


        <div
            id="frutaSpeciesMenu"
            class="species-dropdown"
        >

            <button
                class="species-btn"
                type="button"
                data-species="abacaxi"
            >
                🍍 Abacaxi
            </button>

        </div>


        <!-- =================================================
             MEDICINAIS
        ================================================== -->

        <button
            id="medicinalAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="medicinalAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🌿 ESPÉCIES
        </button>


        <div
            id="medicinalSpeciesMenu"
            class="species-dropdown"
        >

        </div>


        <!-- =================================================
             PANC
        ================================================== -->

        <button
            id="pancAudioLeftButton"
            class="track-button audio-left-fly-btn"
            type="button"
        >
            🔊 CONHEÇA
        </button>


        <button
            id="pancAudioRightButton"
            class="track-button audio-right-fly-btn"
            type="button"
        >
            🌱 ESPÉCIES
        </button>


        <div
            id="pancSpeciesMenu"
            class="species-dropdown"
        >

        </div>


    </div>


    <!-- =====================================================
         CONTEÚDO DA ESPÉCIE
    ====================================================== -->

    <section
        id="speciesContent"
        aria-hidden="true"
    >

        <div class="species-video-container">


            <h2
                id="speciesTitle"
                class="titulo-video"
            >
                ALFACE
            </h2>


            <video
                id="speciesVideo"
                playsinline
                webkit-playsinline
                preload="metadata"
                controls
            >
            </video>


            <div class="species-video-buttons">

                <button
                    id="btnHistoria"
                    type="button"
                >
                    📖 HISTÓRIA
                </button>


                <button
                    id="btnCaracteristicas"
                    type="button"
                >
                    🌱 CARACTERÍSTICAS
                </button>


                <button
                    id="btnCuriosidades"
                    type="button"
                >
                    💡 CURIOSIDADES
                </button>

            </div>


            <button
                id="closeSpeciesButton"
                type="button"
                class="close-species-button"
            >
                ✕ FECHAR
            </button>


        </div>

    </section>


    <!-- =====================================================
         MINDAR / A-FRAME
         
         IMPORTANTE:
         targets.mind está dentro da pasta Imagens.
    ====================================================== -->

    <a-scene
mindar-image="imageTargetSrc: Imagens/targets.mind;"
color-space="sRGB"
renderer="colorManagement:true,physicallyCorrectLights"
xr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">


        <!-- =================================================
             CÂMERA
        ================================================== -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            cursor="fuse: false; rayOrigin: mouse;"
            raycaster="objects: .clickable"
        >
        </a-camera>


        <!-- =================================================
             TRACK 0 - FOLHOSAS
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 0"
        >
        </a-entity>


        <!-- =================================================
             TRACK 1 - TEMPEROS
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 1"
        >
        </a-entity>


        <!-- =================================================
             TRACK 2 - FRUTOS
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 2"
        >
        </a-entity>


        <!-- =================================================
             TRACK 3 - FRUTAS
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 3"
        >
        </a-entity>


        <!-- =================================================
             TRACK 4 - MEDICINAIS
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 4"
        >
        </a-entity>


        <!-- =================================================
             TRACK 5 - PANC
        ================================================== -->

        <a-entity
            mindar-image-target="targetIndex: 5"
        >
        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./main.js"></script>


</body>

</html>
