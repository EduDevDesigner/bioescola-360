<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <title>BIOESCOLA 360</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- A-FRAME EXTRAS -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <!-- POSTPROCESSING -->
    <script src="https://unpkg.com/aframe-effects@1.0.1/dist/aframe-effects.min.js"></script>

</head>
<body>

<!-- =====================================================
MENSAGEM DE TRACKING
===================================================== -->

<div id="track-message">

    APONTE A CÂMERA
    <br>
    DO DISPOSITIVO
    <br>
    PARA UMA DAS
    <br>
    IMAGENS NO
    <br>
    AMBIENTE.

</div>

<!-- =====================================================
BOTÃO QUIZ
===================================================== -->

<button id="finalButtonTop" class="next-top-btn">📝</button>

<!-- =====================================================
TRACK 0 — FOLHOSAS
===================================================== -->

<button
    id="folhosaAudioLeftButton"
    class="audio-left-fly-btn">
    CONHEÇA
</button>

<button
    id="folhosaAudioRightButton"
    class="audio-right-fly-btn dropdown-btn">
    ESPÉCIES ▼
</button>

<div
    id="folhosaSpeciesMenu"
    class="species-dropdown">

    <button
        class="species-btn"
        data-species="alface">
        ALFACE
    </button>

    <button
        class="species-btn"
        data-species="couve">
        COUVE-MANTEIGA
    </button>

    <button
        class="species-btn"
        data-species="rucula">
        RÚCULA
    </button>

</div>
<!-- =====================================================
TRACK 1 — TEMPEROS E ERVAS AROMÁTICAS
===================================================== -->

<button id="temperoAudioLeftButton" class="audio-left-fly-btn">CONHEÇA</button>

<button id="temperoAudioRightButton" class="audio-right-fly-btn dropdown-btn">ESPÉCIES ▼</button>

<div id="temperoSpeciesMenu" class="species-dropdown">
    <button>Opção 1</button>
    <button>Opção 2</button>
    <button>Opção 3</button>
</div>

<!-- =====================================================
TRACK 2 — FRUTOS
===================================================== -->

<button
    id="frutoAudioLeftButton"
    class="audio-left-fly-btn"
>

    CONHEÇA

</button>


<button
    id="frutoAudioRightButton"
    class="audio-right-fly-btn dropdown-btn"
>

    ESPÉCIES ▼

</button>


<div
    id="frutoSpeciesMenu"
    class="species-dropdown"
>

    <button>Opção 1</button>
    <button>Opção 2</button>
    <button>Opção 3</button>

</div>



<!-- =====================================================
TRACK 3 — FRUTAS
===================================================== -->

<button
    id="frutaAudioLeftButton"
    class="audio-left-fly-btn"
>

    CONHEÇA

</button>


<button
    id="frutaAudioRightButton"
    class="audio-right-fly-btn dropdown-btn"
>

    ESPÉCIES ▼

</button>


<div
    id="frutaSpeciesMenu"
    class="species-dropdown"
>

    <button>Opção 1</button>
    <button>Opção 2</button>
    <button>Opção 3</button>

</div>



<!-- =====================================================
TRACK 4 — MEDICINAIS E AROMÁTICAS
===================================================== -->

<button
    id="medicinalAudioLeftButton"
    class="audio-left-fly-btn"
>

    CONHEÇA

</button>


<button
    id="medicinalAudioRightButton"
    class="audio-right-fly-btn dropdown-btn"
>

    ESPÉCIES ▼

</button>


<div
    id="medicinalSpeciesMenu"
    class="species-dropdown"
>

    <button>Opção 1</button>
    <button>Opção 2</button>
    <button>Opção 3</button>

</div>



<!-- =====================================================
TRACK 5 — PANC
===================================================== -->

<button
    id="pancAudioLeftButton"
    class="audio-left-fly-btn"
>

    CONHEÇA

</button>


<button
    id="pancAudioRightButton"
    class="audio-right-fly-btn dropdown-btn"
>

    ESPÉCIES ▼

</button>


<div
    id="pancSpeciesMenu"
    class="species-dropdown"
>

    <button>Opção 1</button>
    <button>Opção 2</button>
    <button>Opção 3</button>

</div>



<!-- =====================================================
ÁUDIOS
===================================================== -->


<!-- TRACK 0 — FOLHOSAS -->
<audio id="audioFolhosas" src="Audios/Narrativa_Folhosas.mp3"></audio>

<!-- TRACK 1 — TEMPEROS E ERVAS AROMÁTICAS -->
<audio id="audioTemperos" src="Audios/Narrativa_Megafauna.mp3"></audio>

<!-- TRACK 2 — FRUTOS -->
<audio id="audioFrutos" src="Audios/Narrativa_Venus_Willendorf.mp3"></audio>

<!-- TRACK 3 — FRUTAS -->
<audio id="audioFrutas" src="Audios/Narrativa_Vogelherd.mp3"></audio>

<!-- TRACK 4 — MEDICINAIS E AROMÁTICAS -->
<audio id="audioMedicinais" src="Audios/Narrativa_Colombo.mp3"></audio>

<!-- TRACK 5 — PANC -->
<audio id="audioPanc" src="Audios/Narrativa_Mona.mp3"></audio>
    
<!-- SOM DOS BOTÕES -->
<audio id="clickSound" src="Audios/acerto.mp3" ></audio>

<!-- =====================================================
CENA AR
===================================================== -->

<a-scene mindar-image="imageTargetSrc: Imagens/targets.mind;" color-space="sRGB" 
        renderer=" colorManagement: true;
        physicallyCorrectLights: true;
        shadowMap.enabled: true;
        shadowMap.type: PCFSoftShadowMap;"
        xr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    effects=" fxaa: true; bloom: strength: 1.2; bloom: radius: 1; bloom: threshold: 0.8;">


<a-assets>

    <a-asset-item id="base" src="Modelos/base.glb"></a-asset-item>

</a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- =====================================================
TRACK 0 — FOLHOSAS
===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 0">

    <a-entity id="velociGroup" rotation="0 0 180">

        <a-gltf-model id="velociBase" rotation="90 0 0" position="0 0 0" scale="0.3 0.3 0.3" src="#base" material="shader: shadow" shadow="receive: true"></a-gltf-model>

    </a-entity>

    <a-plane id="velociFog" color="#d9f1ff" opacity="0" width="2.8" height="2.8" rotation="-90 0 0"  position="0 -0.15 0"></a-plane>

</a-entity>


<!-- =====================================================
TRACK 1 — TEMPEROS E ERVAS AROMÁTICAS
===================================================== -->

<a-entity mindar-image-target="targetIndex: 1">

    <a-entity id="faunaGroup" rotation="0 0 -90" >

        <a-gltf-model id="faunaBase" rotation="90 0 0" position="0 0 0" scale="0.4 0.4 0.4" src="#base"></a-gltf-model>
      
    </a-entity>

    <a-plane
        id="faunaFog"
        color="#d9f1ff"
        opacity="0"
        width="2.8"
        height="2.8"
        rotation="-90 0 0"
        position="0 -0.15 0"
    ></a-plane>

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="5.4"
    ></a-light>

    <a-light
        type="hemisphere"
        color="#ffffff"
        groundColor="#b5b5b5"
        intensity="4.2"
    ></a-light>

    <a-light
        type="directional"
        color="#fff8e5"
        intensity="1.8"
        position="-2 -4 3"
    ></a-light>

    <a-light
        type="directional"
        color="#d6ecff"
        intensity="0.8"
        position="-3 2 -2"
    ></a-light>

</a-entity>


<!-- =====================================================
TRACK 2 — FRUTOS
===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 2"
>

    <a-entity
        id="venusGroup"
        rotation="0 0 0"
    >

        <a-gltf-model
            id="venusModel"
            rotation="90 0 0"
            position="0 0 0"
            scale="0.3 0.3 0.3"
            src="#base"
        ></a-gltf-model>

    </a-entity>

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="1.4"
    ></a-light>

    <a-light
        type="hemisphere"
        color="#ffffff"
        groundColor="#b5b5b5"
        intensity="1.2"
    ></a-light>

    <a-light
        type="directional"
        color="#fff8e5"
        intensity="2.8"
        position="-2 -4 3"
    ></a-light>

</a-entity>

<!-- =====================================================
TRACK 3 — FRUTAS
===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 3"
>

    <a-entity
        id="vogelherdGroup"
        rotation="0 0 0"
    >

        <a-gltf-model
            id="cavaloModel"
            rotation="90 0 0"
            position="0.3 0 0.2"
            scale="0.8 0.8 0.8"
            src="#base"
        ></a-gltf-model>

    </a-entity>

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="1.4"
    ></a-light>

    <a-light
        type="hemisphere"
        color="#ffffff"
        groundColor="#b5b5b5"
        intensity="1.2"
    ></a-light>

    <a-light
        type="directional"
        color="#fff8e5"
        intensity="2.8"
        position="-2 -4 3"
    ></a-light>

</a-entity>


<!-- =====================================================
TRACK 4 — MEDICINAIS
===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 4"
>

    <a-plane
        id="colomboPlane"
        position="0 0 0"
        width="1.6"
        height="2.4"
    ></a-plane>

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="1.4"
    ></a-light>

    <a-light
        type="hemisphere"
        color="#ffffff"
        groundColor="#b5b5b5"
        intensity="1.2"
    ></a-light>

    <a-light
        type="directional"
        color="#fff8e5"
        intensity="2.8"
        position="-2 -4 3"
    ></a-light>

</a-entity>

<!-- =====================================================
TRACK 5 — PANC
===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 5"
>

    <a-plane
        id="monalisaPlane"
        position="0 0 0"
        width="1.6"
        height="2.4"
    ></a-plane>

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="1.4"
    ></a-light>

    <a-light
        type="hemisphere"
        color="#ffffff"
        groundColor="#b5b5b5"
        intensity="1.2"
    ></a-light>
  
    <a-light
        type="directional"
        color="#fff8e5"
        intensity="2.8"
        position="-2 -4 3"
    ></a-light>

</a-entity>

</a-scene>
    
<!-- =====================================================
CONTAINER DE VÍDEO DA ESPÉCIE
===================================================== -->

<div id="speciesContent" aria-hidden="true">

    <div class="species-video-container">

        <h2 id="speciesTitle" class="titulo-video">
            ALFACE
        </h2>

        <video
            id="speciesVideo"
            playsinline
            preload="none"
            controls>

            <source
                id="speciesWebm"
                src=""
                type="video/webm">

            <source
                id="speciesMp4"
                src=""
                type="video/mp4">

        </video>

    </div>


    <!-- BOTÕES DOS VÍDEOS -->

    <div class="species-video-buttons">

        <button
            id="btnHistoria"
            type="button">
            HISTÓRIA
        </button>

        <button
            id="btnCaracteristicas"
            type="button">
            CARACTERÍSTICAS
        </button>

        <button
            id="btnCuriosidades"
            type="button">
            CURIOSIDADES
        </button>

    </div>

</div>    

<!-- =====================================================
SISTEMA DE PROGRESSO
===================================================== -->

<div id="progressContainer">

    <div id="progressText">

        Temas Visitados:

        <span id="progressCount">0</span>
        /6
    </div>

</div>

<script src="main.js"></script>
  
</body>
</html>
