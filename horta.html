<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="description"
content="BioEscola 360° - Fotos e Vídeos da Horta"

>

<title>NOSSA HORTA — BIOESCOLA 360°</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;
    min-height: 100%;

    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            180deg,
            #0b3d2e,
            #06251d
        );

    color: white;

}


/* =====================================================
   PÁGINA
===================================================== */

.page {

    width: 100%;
    min-height: 100vh;

    padding:
        25px 15px 40px;

}


/* =====================================================
   TÍTULO
===================================================== */

.page-title {

    margin:
        10px 0 8px;

    text-align: center;

    font-size:
        clamp(26px, 7vw, 40px);

    font-weight: bold;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,0.5);

}


.page-subtitle {

    max-width: 650px;

    margin:
        0 auto 30px;

    text-align: center;

    color:
        rgba(255,255,255,0.85);

    font-size:
        clamp(13px, 3.5vw, 17px);

    line-height: 1.4;

}


/* =====================================================
   CATEGORIAS
===================================================== */

.categories {

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: stretch;

    gap: 15px;

}


/* =====================================================
   BOTÃO DE CATEGORIA
===================================================== */

.category-button {

    flex: 1;

    min-height: 150px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.12);

    color: white;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 10px;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,0.35);

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}


.category-button:active {

    transform:
        scale(0.95);

}


.category-icon {

    font-size:
        clamp(48px, 12vw, 72px);

}


.category-name {

    font-size:
        clamp(17px, 4vw, 22px);

    font-weight: bold;

    letter-spacing:
        0.5px;

}


/* =====================================================
   GALERIA
===================================================== */

.gallery {

    display: none;

    width: 100%;

    max-width: 900px;

    margin:
        25px auto 0;

}


.gallery.open {

    display: block;

}


/* =====================================================
   CABEÇALHO DA GALERIA
===================================================== */

.gallery-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;

}


.gallery-title {

    margin: 0;

    font-size:
        clamp(20px, 5vw, 28px);

}


.back-button {

    padding:
        9px 14px;

    border: none;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.15);

    color: white;

    font-weight: bold;

    cursor: pointer;

}


/* =====================================================
   GALERIA DE MINIATURAS
===================================================== */

.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

}


/* =====================================================
   CARD
===================================================== */

.gallery-card {

    overflow: hidden;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.10);

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.3);

    transition:
        transform 0.2s ease;

}


.gallery-card:active {

    transform:
        scale(0.97);

}


/* =====================================================
   MINIATURA DAS FOTOS
===================================================== */

.gallery-card img {

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

}


/* =====================================================
   MINIATURA DOS VÍDEOS
===================================================== */

.gallery-card video {

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    background:
        #000;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 10000;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 15px;

    background:
        rgba(0,0,0,0.90);

}


.modal.open {

    display: flex;

}


/* =====================================================
   CONTEÚDO DO MODAL
===================================================== */

.modal-content {

    position: relative;

    width:
        min(96vw, 800px);

    max-height: 94vh;

    overflow-y: auto;

    padding: 15px;

    border-radius: 20px;

    background:
        rgba(8, 42, 32, 0.98);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.7);

}


/* =====================================================
   BOTÃO FECHAR
===================================================== */

.close-button {

    position: absolute;

    top: 10px;
    right: 10px;

    z-index: 5;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.75);

    color: white;

    font-size: 22px;

    cursor: pointer;

}


/* =====================================================
   IMAGEM AMPLIADA
===================================================== */

.modal-image {

    display: block;

    width: 100%;

    max-height:
        75vh;

    object-fit: contain;

    border-radius: 14px;

    background:
        #000;

}


/* =====================================================
   VÍDEO AMPLIADO
===================================================== */

.modal-video {

    display: block;

    width: 100%;

    max-height:
        75vh;

    border-radius: 14px;

    background:
        #000;

}


/* =====================================================
   CONTADOR
===================================================== */

.item-counter {

    margin-top: 10px;

    text-align: center;

    color:
        rgba(255,255,255,0.75);

    font-size: 13px;

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

.modal-navigation {

    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;

}


.nav-button {

    flex: 1;

    max-width: 220px;

    padding:
        11px;

    border: none;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.15);

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.nav-button:active {

    background:
        rgba(255,255,255,0.28);

}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 700px) {

    .gallery-grid {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 16px;

    }


    .category-button:hover {

        transform:
            translateY(-3px);

        background:
            rgba(255,255,255,0.18);

    }


    .gallery-card:hover {

        transform:
            translateY(-2px);

    }

}


/* =====================================================
   MOBILE PEQUENO
===================================================== */

@media (max-width: 380px) {

    .categories {

        gap: 10px;

    }


    .category-button {

        min-height: 125px;

    }


    .gallery-grid {

        gap: 9px;

    }

}

</style>

</head>

<body>

<div class="page">


<!-- =================================================
     TÍTULO
================================================== -->

<h1 class="page-title">
    🌱 NOSSA HORTA
</h1>


<p class="page-subtitle">
    Conheça a nossa horta por meio de fotos e vídeos.
</p>


<!-- =================================================
     CATEGORIAS
================================================== -->

<div
    id="categories"
    class="categories"
>


    <button
        id="photosCategory"
        class="category-button"
        type="button"
    >

        <span class="category-icon">
            📷
        </span>

        <span class="category-name">
            FOTOS
        </span>

    </button>


    <button
        id="videosCategory"
        class="category-button"
        type="button"
    >

        <span class="category-icon">
            🎥
        </span>

        <span class="category-name">
            VÍDEOS
        </span>

    </button>


</div>


<!-- =================================================
     GALERIA DE FOTOS
================================================== -->

<section
    id="photosGallery"
    class="gallery"
>

    <div class="gallery-header">

        <h2 class="gallery-title">
            📷 FOTOS
        </h2>

        <button
            id="backFromPhotos"
            class="back-button"
            type="button"
        >
            ← Voltar
        </button>

    </div>


    <div
        id="photosGrid"
        class="gallery-grid"
    >
    </div>

</section>


<!-- =================================================
     GALERIA DE VÍDEOS
================================================== -->

<section
    id="videosGallery"
    class="gallery"
>

    <div class="gallery-header">

        <h2 class="gallery-title">
            🎥 VÍDEOS
        </h2>

        <button
            id="backFromVideos"
            class="back-button"
            type="button"
        >
            ← Voltar
        </button>

    </div>


    <div
        id="videosGrid"
        class="gallery-grid"
    >
    </div>

</section>


</div>

<!-- =====================================================
     MODAL
====================================================== -->

<div
    id="galleryModal"
    class="modal"
    aria-hidden="true"
>


<div class="modal-content">


    <button
        id="closeModal"
        class="close-button"
        type="button"
        aria-label="Fechar"
    >
        ✕
    </button>


   <img
    id="modalImage"
    class="modal-image"
    src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
    alt="Foto da horta"
    style="display:none;"
>


    <video
        id="modalVideo"
        class="modal-video"
        playsinline
        webkit-playsinline
        preload="metadata"
        controls
        style="display:none;"
    >
    </video>


    <div
        id="itemCounter"
        class="item-counter"
    >
    </div>


    <div class="modal-navigation">

        <button
            id="previousButton"
            class="nav-button"
            type="button"
        >
            ◀ ANTERIOR
        </button>


        <button
            id="nextButton"
            class="nav-button"
            type="button"
        >
            PRÓXIMA ▶
        </button>

    </div>


</div>


</div>

<script>

/* =====================================================
   FOTOS
===================================================== */

/* =====================================================
   FOTOS
===================================================== */
const fotos = [
    { imagem: "Imagens/Horta_01.jpeg" },
    { imagem: "Imagens/Horta_02.jpeg" },
    { imagem: "Imagens/Horta_03.jpeg" },
    { imagem: "Imagens/Horta_04.jpeg" },
    { imagem: "Imagens/Horta_05.jpeg" },
    { imagem: "Imagens/Horta_06.jpeg" },
    { imagem: "Imagens/Horta_07.jpeg" },
    { imagem: "Imagens/Horta_08.jpeg" },
    { imagem: "Imagens/Horta_09.jpeg" },
    { imagem: "Imagens/Horta_10.jpeg" },
    { imagem: "Imagens/Horta_11.jpeg" },
    { imagem: "Imagens/Horta_12.jpeg" },
    { imagem: "Imagens/Horta_13.jpeg" },
    { imagem: "Imagens/Horta_14.jpeg" },
    { imagem: "Imagens/Horta_15.jpeg" },
    { imagem: "Imagens/Horta_16.jpeg" }
];

/* =====================================================
   VÍDEOS
===================================================== */
const videos = [
    { video: "Video/Horta_01.webm" },
    { video: "Video/Horta_02.webm" },
    { video: "Video/Horta_03.webm" }
];

/* =====================================================
   ELEMENTOS
===================================================== */

const categories =
    document.getElementById("categories");

const photosCategory =
    document.getElementById("photosCategory");

const videosCategory =
    document.getElementById("videosCategory");

const photosGallery =
    document.getElementById("photosGallery");

const videosGallery =
    document.getElementById("videosGallery");

const photosGrid =
    document.getElementById("photosGrid");

const videosGrid =
    document.getElementById("videosGrid");

const backFromPhotos =
    document.getElementById("backFromPhotos");

const backFromVideos =
    document.getElementById("backFromVideos");

const galleryModal =
    document.getElementById("galleryModal");

const modalImage =
    document.getElementById("modalImage");

const modalVideo =
    document.getElementById("modalVideo");

const itemCounter =
    document.getElementById("itemCounter");

const closeModal =
    document.getElementById("closeModal");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");


/* =====================================================
   ESTADO
===================================================== */

let categoriaAtual =
    null;

let itemAtual =
    0;


/* =====================================================
   CRIAR MINIATURAS DE FOTOS
===================================================== */

fotos.forEach(
    (item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "gallery-card";


        card.innerHTML = `

            <img
                src="${item.imagem}"
                alt="Foto da horta"
                loading="lazy"
            >

        `;


        card.addEventListener(
            "click",
            () => {

                abrirFoto(index);

            }
        );


        photosGrid.appendChild(card);

    }
);


/* =====================================================
   CRIAR MINIATURAS DOS VÍDEOS
===================================================== */

videos.forEach(
    (item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "gallery-card";


        card.innerHTML = `

            <video
                src="${item.video}"
                muted
                preload="metadata"
                playsinline
            >
            </video>

        `;


        const miniVideo =
            card.querySelector("video");


        miniVideo.style.width =
            "100%";

        miniVideo.style.aspectRatio =
            "1 / 1";

        miniVideo.style.objectFit =
            "cover";

        miniVideo.style.display =
            "block";

        miniVideo.style.background =
            "#000";


        card.addEventListener(
            "click",
            () => {

                abrirVideo(index);

            }
        );


        videosGrid.appendChild(card);

    }
);


/* =====================================================
   ABRIR CATEGORIA FOTOS
===================================================== */

photosCategory.addEventListener(
    "click",
    () => {

        categories.style.display =
            "none";

        photosGallery.classList.add(
            "open"
        );

    }
);


/* =====================================================
   ABRIR CATEGORIA VÍDEOS
===================================================== */

videosCategory.addEventListener(
    "click",
    () => {

        categories.style.display =
            "none";

        videosGallery.classList.add(
            "open"
        );

    }
);


/* =====================================================
   VOLTAR DAS FOTOS
===================================================== */

backFromPhotos.addEventListener(
    "click",
    () => {

        photosGallery.classList.remove(
            "open"
        );

        categories.style.display =
            "flex";

    }
);


/* =====================================================
   VOLTAR DOS VÍDEOS
===================================================== */

backFromVideos.addEventListener(
    "click",
    () => {

        videosGallery.classList.remove(
            "open"
        );

        categories.style.display =
            "flex";

    }
);


/* =====================================================
   ABRIR FOTO
===================================================== */

function abrirFoto(index) {

    const item =
        fotos[index];


    if (!item) {
        return;
    }


    categoriaAtual =
        "fotos";

    itemAtual =
        index;


    modalImage.src =
        item.imagem;


    modalImage.style.display =
        "block";


    modalVideo.pause();


    modalVideo.removeAttribute(
        "src"
    );


    modalVideo.style.display =
        "none";


    modalVideo.load();


    atualizarContador(
        fotos.length
    );


    abrirModal();

}


/* =====================================================
   ABRIR VÍDEO
===================================================== */

function abrirVideo(index) {

    const item =
        videos[index];


    if (!item) {
        return;
    }


    categoriaAtual =
        "videos";

    itemAtual =
        index;


    modalImage.style.display =
        "none";


    modalImage.removeAttribute(
        "src"
    );


    modalVideo.pause();


    modalVideo.src =
        item.video;


    modalVideo.load();


    modalVideo.style.display =
        "block";


    atualizarContador(
        videos.length
    );


    abrirModal();

}


/* =====================================================
   ABRIR MODAL
===================================================== */

function abrirModal() {

    galleryModal.classList.add(
        "open"
    );


    galleryModal.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   FECHAR MODAL
===================================================== */

function fecharModal() {

    galleryModal.classList.remove(
        "open"
    );


    galleryModal.setAttribute(
        "aria-hidden",
        "true"
    );


    modalVideo.pause();


    modalVideo.removeAttribute(
        "src"
    );


    modalVideo.load();


    document.body.style.overflow =
        "";

}


/* =====================================================
   CONTADOR
===================================================== */

function atualizarContador(total) {

    itemCounter.innerText =
        `${itemAtual + 1} / ${total}`;

}


/* =====================================================
   PRÓXIMO ITEM
===================================================== */

function proximoItem() {

    if (
        categoriaAtual ===
        "fotos"
    ) {

        itemAtual++;


        if (
            itemAtual >=
            fotos.length
        ) {

            itemAtual =
                0;

        }


        abrirFoto(
            itemAtual
        );

        return;

    }


    if (
        categoriaAtual ===
        "videos"
    ) {

        itemAtual++;


        if (
            itemAtual >=
            videos.length
        ) {

            itemAtual =
                0;

        }


        abrirVideo(
            itemAtual
        );

    }

}


/* =====================================================
   ITEM ANTERIOR
===================================================== */

function itemAnterior() {

    if (
        categoriaAtual ===
        "fotos"
    ) {

        itemAtual--;


        if (
            itemAtual < 0
        ) {

            itemAtual =
                fotos.length - 1;

        }


        abrirFoto(
            itemAtual
        );

        return;

    }


    if (
        categoriaAtual ===
        "videos"
    ) {

        itemAtual--;


        if (
            itemAtual < 0
        ) {

            itemAtual =
                videos.length - 1;

        }


        abrirVideo(
            itemAtual
        );

    }

}


/* =====================================================
   EVENTOS
===================================================== */

closeModal.addEventListener(
    "click",
    fecharModal
);


previousButton.addEventListener(
    "click",
    itemAnterior
);


nextButton.addEventListener(
    "click",
    proximoItem
);


/* =====================================================
   CLICAR FORA
===================================================== */

galleryModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            galleryModal
        ) {

            fecharModal();

        }

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            !galleryModal.classList.contains(
                "open"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            fecharModal();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            proximoItem();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            itemAnterior();

        }

    }
);

</script>

</body>

</html>
