<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz – Museu virtual</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ===== MOBILE PADRÃO ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #001c40ff;
  color: #ffffff;
}

/* ===== APP WRAPPER ===== */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow-x: hidden;
  overflow-y: hidden;
  background: #001c40ff;

  /* ================================
     IMAGEM DE FUNDO
     ================================ */
  background-image: url("Imagens/Fundo.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  background-color: #001c40ff;
}

/* ===== DESKTOP CENTRALIZADO ===== */
@media (min-width: 868px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001c40ff;
  }

  .app-wrapper {
    width: 490px;
    height: 844px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
}

/* ===== CONTEÚDO ===== */
.main-content {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
}

header {
  background: rgba(81, 41, 4, 0);
  padding: 13px;
  text-align: center;
  margin-top: 14vh;
}

header h1 {
  margin: 40;
  font-size: 55px;
}

header p {
  margin-top: 1px;
  font-size: 18px;
  font-weight: bold;
  color: #9c7000;
  text-shadow: 1px 1px 10px rgba(190, 135, 0, 0);
}

/* =====================================================
FORMULÁRIO DO ALUNO
===================================================== */

#studentForm {

  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 85%;
  max-width: 360px;

  padding: 20px;

  display: flex;
  flex-direction: column;

  align-items: center;

  gap: 15px;

  box-sizing: border-box;
}

#studentForm input {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 8px;

  font-size: 16px;

  outline: none;

  background:
    rgba(255, 255, 255, 0.9);

  color: #000000;

  font-weight: bold;

  box-sizing: border-box;
}

#startQuizBtn {

  display: flex;

  justify-content: center;

  align-items: center;

  margin: 10px auto 0;

  width: 75%;

  max-width: 250px;

  background: transparent;

  border: none;

  padding: 0;

  cursor: pointer;
}

#startQuizBtn img {

  width: 100%;

  height: auto;

  display: block;
}

/* ===================================================== */

#quizBox {
  padding: 80px;
  max-width: 800px;
  margin: 150.1px auto 0 auto;
  box-sizing: border-box;
}

#moduleTitle {
  font-size: 30px;
  font-weight: bold;
  margin-bottom:30px;
  color: #ffffff;
  text-align: center;
  text-shadow: 1px 5px 1px rgba(0, 0, 0, 0.8);
}

#question {
  font-size: 18px;
  margin-bottom: 35px;
  font-weight: bold;
  text-align: center;
  text-shadow: 1px 3px 1px rgba(0, 0, 0, 0.8);
  background: rgb(0, 0, 0);
  border-radius: 6px;
  padding: 8px;
}

.option {
  background: rgb(2, 100, 17);
  border-radius: 6px;
  padding: 15px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: 0.3s;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 0 15px rgba(0,0,0,0.9);
}

.option:hover {
  background: rgba(140, 255, 0, 0.65);
}

.option.correct {
  background: #00ff6b;
}

.option.wrong {
  background: #ff1800;
}

.option.disabled {
  pointer-events: none;
  opacity: 0.8;
}

#nextBtn {
  margin-top: 55px;
  margin-left: 80px;
  width: 60%;
  padding: 12px;
  background: #ffa800;
  border: none;
  border-radius: 6px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: none;
  box-shadow: 0 0 15px rgba(0,0,0,0.9);
}

#scoreBox {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  padding: 12px;
  font-size: 14px;
  font-weight: bold;
  text-shadow: 1px 1px 1px rgb(0, 0, 0);
  background: rgb(1, 51, 0);
  border-radius: 18px;
  backdrop-filter: blur(10px);
  width: 380px;
  max-width: 90%;
  z-index: 3;
  box-sizing: border-box;
  box-shadow: 0 0 15px rgba(0,0,0,0.9);
}

#scoreBox h2 {
  font-size: 20px;
  color: #efb900;
  text-shadow: 1px 1px 1px rgb(0, 0, 0);
}

.report-line {
  margin: 2px 0;
}

#generatePdf {
  margin-top: 80px;
  padding: 10px 20px;
  color: #000000;
  font-size: 16px;
  font-weight: bold;
  background: rgb(255, 181, 4);
  cursor: pointer;
  border: none;
  border-radius: 18px;
}

.dados-aluno {
  margin-bottom: 30px;
  font-size: 14px;
  color: #ffcb48;
}

/* =====================================================
AJUSTES PARA CELULARES PEQUENOS
===================================================== */

@media (max-width: 480px) {

  #studentForm {

    width: 88%;

    max-width: 340px;

    padding: 15px;
  }

  #studentForm input {

    font-size: 15px;

    padding: 13px;
  }

  #startQuizBtn {

    width: 70%;

    max-width: 230px;

    margin-top: 8px;
  }

}

/* =====================================================
CELULARES MUITO PEQUENOS
===================================================== */

@media (max-height: 650px) {

  #studentForm {

    top: 52%;
  }

  #startQuizBtn {

    width: 62%;
  }

}

/* =====================================================
TALLETES / TELAS MAIORES
===================================================== */

@media (min-width: 600px) and (max-width: 867px) {

  #studentForm {

    width: 55%;

    max-width: 420px;
  }

  #startQuizBtn {

    width: 60%;

    max-width: 240px;
  }

}
</style>

</head>

<body>

<div class="app-wrapper">

  <div id="overlay"></div>

  <div class="main-content">

```
<audio id="audioAcerto" src="Audios/acerto.mp3"></audio>
<audio id="audioErro" src="Audios/erro.mp3"></audio>
```

<!-- =====================================================
FORMULÁRIO DO ALUNO
===================================================== -->

<div id="studentForm">

<input
type="text"
id="nomeAluno"
placeholder="Nome do aluno">

<input
type="text"
id="turmaAluno"
placeholder="Digite a turma">

<button id="startQuizBtn">

```
<img
    src="Imagens/btnQuiz.png"
    alt="Iniciar Quiz">
```

</button>

</div>

<!-- ===================================================== -->

```
<div id="quizBox" style="display:none;">

  <div id="moduleTitle"></div>

  <div id="question"></div>

  <div id="options"></div>

  <button id="nextBtn">
    Próxima Pergunta
  </button>

</div>

<div id="scoreBox" style="display:none;">

  <h2>
    Relatório do Aluno
  </h2>

  <div
    id="studentInfo"
    class="dados-aluno">
  </div>

  <p id="scoreText"></p>

  <div id="moduleReport"></div>

  <button id="generatePdf">
    Gerar PDF
  </button>

</div>
```

  </div>

</div>

<script>

// =====================================================
// DADOS DO ALUNO
// =====================================================

let nomeAluno = "";
let turmaAluno = "";


// =====================================================
// INICIAR QUIZ
// =====================================================

document
.getElementById("startQuizBtn")
.onclick = function(){

nomeAluno =
document.getElementById("nomeAluno").value;

turmaAluno =
document.getElementById("turmaAluno").value;

if(nomeAluno.trim()==="" || turmaAluno.trim()===""){

alert("Preencha nome e turma.");

return;

}

document
.getElementById("studentForm")
.style.display="none";

document
.getElementById("quizBox")
.style.display="block";

loadQuestion();

};


// ===== FUNÇÃO DE EMBARALHAMENTO =====

function shuffleArray(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

}


// ===== QUIZ BIOESCOLA 360° =====

const quizData = [

  /* =====================================================
     MÓDULO 1 — FOLHOSAS
  ===================================================== */

  {
    modulo: "Folhosas",

    perguntas: [

      {

        q: "Qual é o nome científico da alface?",

        o: [
          "Lactuca sativa",
          "Eruca vesicaria sativa",
          "Brassica oleracea"
        ],

        c: 0

      },


      {

        q: "Qual é o ciclo médio da rúcula?",

        o: [
          "30 a 40 dias",
          "70 a 90 dias",
          "90 a 120 dias"
        ],

        c: 0

      },


      {

        q: "Qual destas características pertence à couve-manteiga?",

        o: [
          "Pode crescer mais de um metro de altura",
          "Possui flores que duram apenas algumas horas",
          "Produz frutos do tipo baga"
        ],

        c: 0

      }

    ]

  },


  /* =====================================================
     MÓDULO 2 — TEMPEROS E ERVAS AROMÁTICAS
  ===================================================== */

  {

    modulo: "Temperos e Ervas Aromáticas",

    perguntas: [

      {

        q: "Qual é o nome científico do coentro?",

        o: [
          "Coriandrum sativum",
          "Petroselinum crispum",
          "Ocimum basilicum"
        ],

        c: 0

      },


      {

        q: "Segundo o catálogo, onde foram encontradas sementes de coentro?",

        o: [
          "Na tumba do faraó Tutancâmon",
          "Nas pirâmides de Teotihuacán",
          "Em uma caverna na Europa"
        ],

        c: 0

      },


      {

        q: "Qual destas plantas pode viver por anos e possui folhas que concentram óleos essenciais?",

        o: [
          "Alecrim",
          "Cebolinha",
          "Salsa"
        ],

        c: 0

      }

    ]

  },


  /* =====================================================
     MÓDULO 3 — FRUTOS
  ===================================================== */

  {

    modulo: "Frutos",

    perguntas: [

      {

        q: "Qual destas plantas pertence à categoria Frutos?",

        o: [
          "Tomate",
          "Alface",
          "Abacaxi"
        ],

        c: 0

      },


      {

        q: "Qual é o ciclo médio do tomate?",

        o: [
          "90 a 110 dias",
          "15 a 18 meses",
          "30 a 40 dias"
        ],

        c: 0

      },


      {

        q: "Segundo o catálogo, o milho deve ser plantado preferencialmente:",

        o: [
          "Em blocos para garantir a polinização pelo vento",
          "Somente em vasos",
          "Em locais totalmente sombreados"
        ],

        c: 0

      }

    ]

  },


  /* =====================================================
     MÓDULO 4 — FRUTAS
  ===================================================== */

  {

    modulo: "Frutas",

    perguntas: [

      {

        q: "Qual é o ciclo médio do abacaxi?",

        o: [
          "15 a 18 meses",
          "30 a 50 dias",
          "60 a 90 dias"
        ],

        c: 0

      },


      {

        q: "Qual fruta é descrita no catálogo como um conjunto de dezenas de pequenos frutos que se fundem?",

        o: [
          "Abacaxi",
          "Banana",
          "Pitanga"
        ],

        c: 0

      },


      {

        q: "Qual é o nome científico do maracujá?",

        o: [
          "Passiflora edulis",
          "Musa spp.",
          "Eugenia uniflora"
        ],

        c: 0

      }

    ]

  },


  /* =====================================================
     MÓDULO 5 — MEDICINAIS E AROMÁTICAS
  ===================================================== */

  {

    modulo: "Medicinais e Aromáticas",

    perguntas: [

      {

        q: "Qual destas plantas pertence à categoria Medicinais e Aromáticas?",

        o: [
          "Hortelã",
          "Rúcula",
          "Tomate"
        ],

        c: 0

      },


      {

        q: "Qual é o ciclo médio da hortelã para iniciar a colheita?",

        o: [
          "40 dias",
          "90 dias",
          "15 meses"
        ],

        c: 0

      },


      {

        q: "Qual planta não deve ser confundida com o Capim Santo?",

        o: [
          "Citronela",
          "Babosa",
          "Hortelã"
        ],

        c: 0

      }

    ]

  },


  /* =====================================================
     MÓDULO 6 — PANC
  ===================================================== */

  {

    modulo:
      "PANC — Plantas Alimentícias Não Convencionais",

    perguntas: [

      {

        q: "O que significa a sigla PANC?",

        o: [
          "Plantas Alimentícias Não Convencionais",
          "Plantas Aromáticas Naturais Cultivadas",
          "Produtos Agrícolas Naturais e Comestíveis"
        ],

        c: 0

      },


      {

        q: "Qual destas plantas pertence à categoria PANC?",

        o: [
          "Peixinho da Horta",
          "Cebolinha",
          "Abacaxi"
        ],

        c: 0

      },


      {

        q: "Qual característica é atribuída ao Ora-pro-nóbis no catálogo?",

        o: [
          "É um cacto trepador e folhoso",
          "É uma árvore frutífera de grande porte",
          "É uma gramínea de folhas longas"
        ],

        c: 0

      }

    ]

  }

];


// ===== RANDOMIZAÇÃO DAS RESPOSTAS =====

quizData.forEach(mod => {

  mod.perguntas.forEach(pergunta => {

    const respostas =
      pergunta.o.map(
        (texto, index) => ({

          texto,

          correta:
            index === pergunta.c

        })
      );


    shuffleArray(respostas);


    pergunta.o =
      respostas.map(
        r => r.texto
      );


    pergunta.c =
      respostas.findIndex(
        r => r.correta
      );

  });

});


let moduleIndex = 0;

let questionIndex = 0;

let score = 0;

let questionNumber = 1;

let moduleScores =
  new Array(
    quizData.length
  ).fill(0);

let respostasAluno = [];


const moduleTitle =
  document.getElementById(
    "moduleTitle"
  );

const questionEl =
  document.getElementById(
    "question"
  );

const optionsEl =
  document.getElementById(
    "options"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );


function loadQuestion() {

  const current =
    quizData[
      moduleIndex
    ].perguntas[
      questionIndex
    ];


  moduleTitle.innerText =
    quizData[
      moduleIndex
    ].modulo;


  questionEl.innerText =
    questionNumber +
    ") " +
    current.q;


  optionsEl.innerHTML =
    "";


  nextBtn.style.display =
    "none";


  const letters =
    ["A", "B", "C"];


  current.o.forEach(
    (opt, i) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "option";


      div.innerText =
        letters[i] +
        ") " +
        opt;


      div.onclick =
        () =>
          selectOption(
            div,
            i
          );


      optionsEl.appendChild(
        div
      );

    }
  );

}


function selectOption(
  el,
  index
) {

  const correct =
    quizData[
      moduleIndex
    ].perguntas[
      questionIndex
    ].c;


  const perguntaAtual =
    quizData[
      moduleIndex
    ].perguntas[
      questionIndex
    ];


  respostasAluno.push({

    modulo:
      quizData[
        moduleIndex
      ].modulo,

    pergunta:
      perguntaAtual.q,

    respostaAluno:
      perguntaAtual.o[index],

    respostaCorreta:
      perguntaAtual.o[correct],

    acertou:
      index === correct

  });


  const options =
    document.querySelectorAll(
      ".option"
    );


  options.forEach(
    (opt, i) => {

      opt.classList.add(
        "disabled"
      );


      if (
        i === correct
      ) {

        opt.classList.add(
          "correct"
        );

      }


      if (
        i === index &&
        i !== correct
      ) {

        opt.classList.add(
          "wrong"
        );

      }

    }
  );


  if (
    index === correct
  ) {

    score++;

    moduleScores[
      moduleIndex
    ]++;

    audioAcerto.play();

  }

  else {

    audioErro.play();

  }


  nextBtn.style.display =
    "block";

}


nextBtn.onclick = () => {

  questionIndex++;

  questionNumber++;


  if (
    questionIndex >=
    quizData[
      moduleIndex
    ].perguntas.length
  ) {

    moduleIndex++;

    questionIndex = 0;

  }


  if (
    moduleIndex >=
    quizData.length
  ) {

    document
      .getElementById(
        "quizBox"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "scoreBox"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "studentInfo"
      )
      .innerHTML = `
        Nome: ${nomeAluno}<br>
        Turma: ${turmaAluno}
      `;


    document
      .getElementById(
        "scoreText"
      )
      .innerText =
      `Você acertou ${score} de ${quizData.length * 3} perguntas.`;


    const reportDiv =
      document.getElementById(
        "moduleReport"
      );


    reportDiv.innerHTML =
      "";


    quizData.forEach(
      (mod, i) => {

        reportDiv.innerHTML += `
          <div class="report-line">
            ${mod.modulo}: ${moduleScores[i]} de 3 acertos
          </div>`;

      }
    );

  }

  else {

    loadQuestion();

  }

};


document
.getElementById(
  "generatePdf"
)
.onclick = function() {

  const { jsPDF } =
    window.jspdf;


  const doc =
    new jsPDF();


  const agora =
    new Date();


  const dataHora =
    agora.toLocaleDateString(
      "pt-BR"
    ) +
    " " +
    agora.toLocaleTimeString(
      "pt-BR"
    );


  let y = 20;


  doc.setFontSize(16);

  doc.text(
    "Relatório do Quiz",
    20,
    y
  );


  y += 10;


  doc.setFontSize(12);


  doc.text(
    "Aluno: " +
    nomeAluno,
    20,
    y
  );


  y += 8;


  doc.text(
    "Turma: " +
    turmaAluno,
    20,
    y
  );


  y += 8;


  doc.text(
    "Data/Hora: " +
    dataHora,
    20,
    y
  );


  y += 8;


  doc.text(
    `Resultado: ${score} de ${quizData.length * 3}`,
    20,
    y
  );


  y += 15;


  doc.setFontSize(14);

  doc.text(
    "Desempenho por módulo",
    20,
    y
  );


  y += 10;


  doc.setFontSize(11);


  quizData.forEach(
    (mod, i) => {

      doc.text(
        `${mod.modulo}: ${moduleScores[i]} de 3 acertos`,
        20,
        y
      );

      y += 8;

    }
  );


  y += 10;


  doc.setFontSize(14);

  doc.text(
    "Detalhamento das respostas",
    20,
    y
  );


  y += 10;


  doc.setFontSize(10);


  respostasAluno.forEach(
    (resp, index) => {


      if (y > 260) {

        doc.addPage();

        y = 20;

      }


      doc.text(
        `${index + 1}) ${resp.pergunta}`,
        10,
        y
      );


      y += 6;


      const respostaAlunoTexto =
        doc.splitTextToSize(
          "Resposta do aluno: " +
          resp.respostaAluno,
          180
        );


      doc.text(
        respostaAlunoTexto,
        15,
        y
      );


      y +=
        respostaAlunoTexto.length *
        5;


      const respostaCorretaTexto =
        doc.splitTextToSize(
          "Resposta correta: " +
          resp.respostaCorreta,
          180
        );


      doc.text(
        respostaCorretaTexto,
        15,
        y
      );


      y +=
        respostaCorretaTexto.length *
        5;


      doc.text(
        resp.acertou
          ? "Resultado: ACERTOU"
          : "Resultado: ERROU",
        15,
        y
      );


      y += 10;

    }
  );


  doc.save(
    "relatorio_quiz.pdf"
  );

};

</script>

</body>
</html>
