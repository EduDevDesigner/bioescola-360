<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

  
<style>

/* ===== CONFIGURAÇÃO PADRÃO (MOBILE) ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: #001c40ff;
  color: #fff;
}

/* MOBILE ocupa 100% */
.app-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== DESKTOP CENTRALIZADO ===== */ 
@media (min-width: 868px) { 
  body { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #001c40ff; 
  } 
 .app-wrapper { 
    width: 490px; 
    height: 844px; 
    box-shadow: 0 0 40px rgba(0,0,0,0.6); 
  } 
}

/* ===== SEU CÓDIGO ORIGINAL ===== */

.background-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001c4000;
  z-index: 0;
}
  
.background-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
  
.background-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

/* =====================================================
MOLDURA DOS BOTÕES
===================================================== */

.buttons-frame{

position:absolute;
top:65%;
left:50%;
transform:translate(-50%, -50%);
width:120px;
height: 120px;
padding:25px 20px 35px 20px;
border-radius:22px;
z-index:3;
display:flex;
justify-content:center;
align-items:center;
overflow:visible;

}

/* =====================================================
CONTAINER DOS BOTÕES
===================================================== */

.buttons-container {

position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:55px;
width:100%;
}


/* =====================================================
BOTÕES SOMENTE TEXTO
===================================================== */

#btnPlay { 
    
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnPlay:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnPlay img{

width:330px;
height:80px;
object-fit:contain;

}

#btnSobre {
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnSobre:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnSobre img{

width:330px;
height:80px;
object-fit:contain;
}  

#btnCredito {
  width: 340px;
  height: 40px;
  font-size:18px;
  font-weight:bold;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  box-shadow:none;
  cursor:pointer;
  transition:0.3s;
}

#btnCredito:hover{
  transform:scale(1.08);
  color:#00eaff;
}
  
#btnCredito img{

width:330px;
height:80px;
object-fit:contain;
}    
</style>
</head>

<body>

<!-- ÁUDIO -->
<audio id="menuClickSound" src="Audios/acerto.mp3"></audio>
  
<div class="app-wrapper">

  <div class="background-container" aria-hidden="true">
  <video id="bg-video" playsinline preload="auto">
    <source src="Video/BioEscola%20360.mp4" type="video/mp4">
  </video>
</div>

  <audio id="bg-audio" autoplay loop muted>
  </audio>

  
<!-- =====================================================
MOLDURA
===================================================== -->

<div class="buttons-frame">

  <div class="buttons-container">

  <!-- BOTÃO 1 -->
<button id="btnPlay" class="continue-btn" onclick="startIntroVideo()">

  <img src="Imagens/btnIniciar.png" alt="Play">

</button>
    
  <!-- BOTÃO 2 -->
<button id="btnSobre" class="sobre-btn" onclick="location.href='sobre.html'">

  <img src="Imagens/btnSobre.png" alt="Sobre">

</button>
    
  <!-- BOTÃO 3 -->
  <button id="btnCredito" class="credito-btn" onclick="location.href='credito.html'">
    <img src="Imagens/btnCraditos.png" alt="Credito">
  </button>     

</div>

</div>

</div>

<script>
  
const audio = document.getElementById('bg-audio');
const video = document.getElementById('bg-video');

const btnPlay = document.getElementById('btnPlay');
const btnSobre = document.getElementById('btnSobre');
const btnCredito = document.getElementById('btnCredito');
const btnStart = document.getElementById('btnStart');

const buttonsFrame = document.querySelector(".buttons-frame");

window.addEventListener('load', () => {
  audio.volume = 0.05;
  audio.muted = false;

  video.pause();
  video.currentTime = 0;
});

function startIntroVideo() {

  buttonsFrame.style.display = "none";

  btnPlay.style.display = "none";
  btnSobre.style.display = "none";
  btnCredito.style.display = "none";

  video.play();
  audio.play();

}

video.addEventListener("ended", () => {
  location.href = "escolha.html";
});
 
  
/* CLICK DOS BOTÕES  */  
  
const menuClickSound =
document.getElementById("menuClickSound");

function tocarSomBotao(){

menuClickSound.pause();

menuClickSound.currentTime=0;

menuClickSound.play().catch(()=>{});

}

/* TODOS OS BOTÕES */

document.querySelectorAll("button").forEach(btn=>{

btn.addEventListener("click",()=>{

tocarSomBotao();

});

});  
  
</script>

</body>
</html>
